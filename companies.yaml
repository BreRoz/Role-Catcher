# The fixed list of companies Role Catcher watches.
# One entry per company. Fields:
#   name:        Company name (shown in emails)
#   ats:         greenhouse | lever | ashby | workday | custom
#   slug:        The company's id on that ATS (the bit in the job board URL).
#                Not needed for "workday" (uses careers_url) or "custom".
#   careers_url: The public careers page (used as a link and for custom/workday)
#   status:      active | paused   (paused companies are skipped)
#
# Example (delete once you add real companies):
companies:
  - name: Example Co
    ats: greenhouse
    slug: exampleco
    careers_url: https://boards.greenhouse.io/exampleco
    status: paused
