# Role Catcher settings. Plain values you can edit.
timezone: America/Chicago
# Local hours (Central) the scheduled run is allowed to proceed. Handles daylight saving.
run_hours_local: [7, 10, 13, 16, 19]

openrouter:
  base_url: https://openrouter.ai/api/v1
  app_url: https://github.com/BreRoz/Role-Catcher   # sent as HTTP-Referer
  app_title: Role Catcher                           # sent as X-Title
  # Model slugs confirmed against openrouter.ai/api/v1/models on 2026-10-12.
  # Change these freely; no code changes needed.
  scoring_model: anthropic/claude-sonnet-5.5
  scoring_fallback: anthropic/claude-sonnet-5       # used automatically if the primary errors
  vetting_model: anthropic/claude-sonnet-5.5
  vetting_fallback: anthropic/claude-sonnet-5
  web_search:                                        # used by company vetting only
    max_results: 5
    engine: null                                     # null = provider's native search for Anthropic models
  prompt_cache_ttl: 5m                               # "5m" or "1h" (1h costs more to write)
  privacy:
    data_collection: deny    # only route to providers that do not store or train on prompts
    zdr: false               # true = zero-data-retention endpoints only (may limit model/provider choice)

scoring:
  threshold: 75            # minimum role-fit score to continue to company vetting

vetting:
  cache_days: 60           # never research the same company twice in this window
  rules: {}                # filled in with section 6

limits:
  max_roles_scored_per_run: 150    # daily/per-run caps keep OpenRouter cost bounded
  max_companies_vetted_per_run: 25
  max_emails_per_day: 10

email:
  default_to: bre999@gmail.com
  smtp_host: smtp.gmail.com
  smtp_port: 465

discovery:
  full_sweep_hours: 24      # whole board registry is swept this often; watchlist boards every run
  workers: 6                # parallel board fetches (kept low to stay polite)
  pause_seconds: 0.2        # per-request pause inside each worker

backfill:
  max_scoring_calls: 100    # hard cap on scoring calls for one --backfill run (override: --max-calls N)
  max_vetting_calls: 20
