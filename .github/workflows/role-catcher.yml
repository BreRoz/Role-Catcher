name: Role Catcher

on:
  schedule:
    # Target: 7am, 10am, 1pm, 4pm, 7pm US Central, every day.
    # GitHub cron is UTC and ignores daylight saving, so both offsets are listed
    # (CDT = UTC-5, CST = UTC-6). The script skips whichever set doesn't match.
    - cron: "5 12,15,18,21,0 * * *"   # Central Daylight Time
    - cron: "5 13,16,19,22,1 * * *"   # Central Standard Time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: role-catcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Role Catcher
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m role_catcher.main --scheduled
          else
            python -m role_catcher.main
          fi

      - name: Commit updated state
        run: |
          git config user.name "role-catcher[bot]"
          git config user.email "role-catcher@users.noreply.github.com"
          git add state/seen_jobs.json
          git diff --staged --quiet || (git commit -m "Update seen jobs" && git pull --rebase && git push)
