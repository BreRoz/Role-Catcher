name: Role Catcher

on:
  schedule:
    # Every 3 hours, 7am-7pm Central. Listed in UTC for both CDT (UTC-5) and
    # CST (UTC-6); the script skips the run that doesn't match Central time.
    - cron: "0 12,13,15,16,18,19,21,22,0,1 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args, e.g. --catchup --days 7 (one-off digest email)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: role-catcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest tip, not the trigger SHA, so queued runs see the previous run's state push
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Role Catcher
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RUN_ARGS: ${{ github.event.inputs.args }}
        run: python -m role_catcher.main $RUN_ARGS
      - name: Commit state back
        if: always()   # keep the run log even when the run failed
        run: |
          git config user.name "role-catcher-bot"
          git config user.email "role-catcher-bot@users.noreply.github.com"
          git add state/ logs/
          git diff --cached --quiet || (git commit -m "Update state [skip ci]" && git push)
