# Code-only pre-filter (section 4). No AI, no cost. Edit freely; no code changes needed.
#
# How titles are matched: case insensitive, whole words only, with punctuation
# ignored ("go-to-market" = "go to market", "L&D" = "l and d"). A role is kept
# when its title matches at least one include pattern and no exclude pattern.
# Every drop, with its reason, is written to logs/last_run.json so you can audit it.
# When in doubt the filter lets a role through; the scorer makes the real call.

title_include:
  - enablement
  - revenue enablement
  - sales enablement
  - gtm
  - go to market
  - gtm engineer
  - gtm systems
  - gtm operations
  - revenue operations
  - rev ops
  - revops
  - sales operations
  - sales engineer
  - sales engineering
  - solutions engineer
  - solution engineer
  - solutions engineering
  - solution engineering
  - solutions architect
  - solution architect
  - solutions designer
  - solutions consultant
  - knowledge management
  - content operations
  - content systems
  - learning and development
  - l and d
  - onboarding
  - product marketing
  - marketing engineer
  - marketing operations
  - marketing automation
  - ai automation
  - ai workflow
  - ai deployment
  - ai architect
  - ai transformation
  - forward deployed
  - customer education

# Include only when the title also contains one of the "with" words.
title_include_paired:
  - match: program manager
    with: [enablement, gtm, go to market, systems]

title_exclude:
  - intern
  - internship
  - new grad
  - entry level
  - junior
  - jr
  - associate
  - coordinator
  - specialist
  - recruiter
  - recruiting
  - talent acquisition
  - talent partner
  - people partner
  - account executive
  - sdr
  - bdr
  - sales development
  - software engineer
  - backend
  - back end
  - frontend
  - front end
  - machine learning engineer
  - research scientist
  - data scientist
  - designer
  - legal
  - finance
  - accountant
  - hr business partner

# An exclude pattern does not fire when the title also contains one of these.
title_exclude_exceptions:
  associate: [associate director]
  designer: [solutions designer]

# An exclude pattern does not fire when the job description is clearly systems
# building: at least min_hits mentions of the terms below in total.
title_exclude_unless_description:
  specialist:
    min_hits: 4
    terms: [systems, automation, workflow, integration, infrastructure, api, engineering, architecture, build]

# Roles clearly below Senior Manager. Titles with an unclear level (plain
# "Manager", "Lead", no level at all) always go through to scoring.
seniority_exclude:
  - analyst
  - assistant
  - apprentice
  - trainee
  - co op
  - graduate
  - early career

location:
  allow_remote: true        # remote roles open to US candidates
  allowed_places:           # on-site or hybrid places that are acceptable
