# Pay floors in USD/year, checked against the BOTTOM of the listed range.
# Remote or Austin: 130k. NYC (when no remote option): 190k.
# No comp listed = flag "check comp" (NYC) or no flag (elsewhere), never reject.
# Several pay bands in one posting: the role is kept if any band meets the floor.
comp:
  min_annual_remote_austin: 130000
  min_annual_nyc: 190000
